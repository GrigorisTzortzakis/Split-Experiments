services:
  fed_server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: splitfed_fed_server
    hostname: fed_server
    networks:
      - split_net
    environment:
      - NUM_CLIENTS=${NUM_CLIENTS:-2}
    command: >
      python fed_server.py
      --host 0.0.0.0
      --port 8766
      --expected-clients ${NUM_CLIENTS:-2}

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: splitfed_server
    hostname: server
    networks:
      - split_net
    volumes:
      - split_outputs:/outputs
      - split_mlruns:/mlruns
    environment:
      - MLFLOW_TRACKING_URI=file:/mlruns
      - NUM_CLIENTS=${NUM_CLIENTS:-2}
      - SFL_VARIANT=${SFL_VARIANT:-v1}
    command: >
      python server.py
      --host 0.0.0.0
      --port 8765
      --cut-layer 1
      --sfl-variant ${SFL_VARIANT:-v1}
      --expected-clients ${NUM_CLIENTS:-2}
      --device cpu
      --seed 17
      --learning-rate 0.01
      --momentum 0.0
      --log-every 200
      --output-dir /outputs
      --mlflow
      --mlflow-uri file:/mlruns
      --mlflow-experiment split-learning
      --mlflow-run-name docker_run_${NUM_CLIENTS:-2}clients

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    networks:
      - split_net
    volumes:
      # Use the existing MNIST dataset from the repo (avoids downloads).
      - ../data:/app/data:ro
    environment:
      - NUM_CLIENTS=${NUM_CLIENTS:-2}
      - CLIENT_ID=${CLIENT_ID:-0}
      - NUM_ROUNDS=${NUM_ROUNDS:-5}
      - LOCAL_EPOCHS=${LOCAL_EPOCHS:-1}
    command: >
      python client.py
      --host server
      --port 8765
      --fed-host fed_server
      --fed-port 8766
      --cut-layer 1
      --device cpu
      --seed 17
      --num-clients ${NUM_CLIENTS:-2}
      --client-id ${CLIENT_ID:-0}
      --num-rounds ${NUM_ROUNDS:-5}
      --local-epochs ${LOCAL_EPOCHS:-1}
      --batch-size 100
      --learning-rate 0.01
      --momentum 0.0
      --num-workers 0
      --log-every 200
      --data-dir /app/data
    depends_on:
      - fed_server
      - server

  mlflow_ui:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: splitfed_mlflow_ui
    networks:
      - split_net
    ports:
      - "5001:5000"
    volumes:
      - split_mlruns:/mlruns
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns

networks:
  split_net:
    driver: bridge

volumes:
  split_outputs:
  split_mlruns:
