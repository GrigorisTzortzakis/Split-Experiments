services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: split_server
    hostname: server
    networks:
      - split_net
    ports:
      - "8765:8765"
    volumes:
      - split_outputs:/outputs
      - split_mlruns:/mlruns
    environment:
      - MLFLOW_TRACKING_URI=file:/mlruns
    command: >
      python server.py
      --host 0.0.0.0
      --port 8765
      --cut-layer 1
      --device cpu
      --seed 17
      --learning-rate 0.01
      --momentum 0.0
      --log-every 200
      --output-dir /outputs
      --mlflow
      --mlflow-uri file:/mlruns
      --mlflow-experiment split-learning
      --mlflow-run-name docker_run_${NUM_CLIENTS:-2}clients

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    networks:
      - split_net
    volumes:
      # Use the existing MNIST dataset from the repo (avoids downloads).
      - ../data:/app/data:ro
    environment:
      - NUM_CLIENTS=${NUM_CLIENTS:-2}
      - CLIENT_ID=${CLIENT_ID:-0}
      - NUM_EPOCHS=${NUM_EPOCHS:-5}
    command: >
      python client.py
      --host server
      --port 8765
      --cut-layer 1
      --device cpu
      --seed 17
      --num-clients ${NUM_CLIENTS:-2}
      --client-id ${CLIENT_ID:-0}
      --num-epochs ${NUM_EPOCHS:-5}
      --turn-batches 1
      --batch-size 100
      --learning-rate 0.01
      --momentum 0.0
      --num-workers 0
      --log-every 200
      --data-dir /app/data
    depends_on:
      - server

networks:
  split_net:
    driver: bridge

volumes:
  split_outputs:
  split_mlruns:
